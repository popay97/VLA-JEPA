# Research base: LIBERO fine-tune from the released VLA-JEPA Pretrain checkpoint on Leonardo.
# Identical to scripts/configs/vlajepa_libero_ft.yaml (paper recipe) except:
#   * Leonardo paths ($FAST/models, $SCRATCH/libero, $WORK/runs); override with CLI dotlist
#   * 1 node x 4 A100 default (per_device 8 -> global batch 32; paper: 8 GPUs, global 64)
#   * 30k steps / 5k warmup "short" schedule (arms/base_120k.yaml restores the paper schedule)
#   * resumable checkpointing knobs (trainer.save_every_minutes, keep_last_states, auto_resume)
#   * research switches at their upstream-equivalent defaults (no bottleneck, clip encoder,
#     wm_loss_weight 0.1, Anchor-Align off). Arms live in scripts/configs/research/arms/.
run_id: base_30k
run_root_dir: /leonardo_work/AIFAC_P02_954/runs
seed: 42
trackers:
- json
is_debug: false
framework:
  name: VLA_JEPA
  qwenvl:
    base_vlm: /leonardo_scratch/fast/AIFAC_P02_954/models/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    encoder_type: vjepa2_clip          # vjepa2_clip | vjepa2_perframe | levjepa
    base_encoder: /leonardo_scratch/fast/AIFAC_P02_954/models/vjepa2-vitl-fpc64-256
    normalize_targets: false           # layer-norm target states per view (V-JEPA2-AC style)
    state_stride: 1                    # perframe / levjepa: keep every k-th frame as a state
    num_frames: 8
    depth: 12
    num_heads: 8
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    wm_loss_weight: 0.1                # upstream hard-coded 0.1 on action batches
    video_wm_loss_weight: 1.0          # upstream 1.0 on video-only batches (cotrain)
    predictor_activation_checkpointing: false
  latent_action:
    bottleneck: none                   # none | layernorm | lowrank | vib | vq | drop
    bottleneck_dim: 32
    vib_beta: 0.001
    vq_codebook_size: 512
    vq_beta: 0.25
    noise_std: 0.0
    pre_layernorm: false
  anchor_align:
    enable_anchor: false
    anchor_weight: 0.1
    anchor_sigma: 1.0
    anchor_layers: all                 # all | last
    anchor_on_video_batch: true
    teacher_source: base_vlm           # base_vlm | pretrained_checkpoint
    enable_align: false
    align_weight: 0.02
    align_min_xyz_norm: 0.0            # set from research/align_stats.py output
    align_axis_map: [0, 1, 2]
    align_zero_point: null             # [x, y, z] offset of "no motion" in normalised units
    align_flip_sign: [false, false, false]
  reduce_in_full_precision: true
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /leonardo_scratch/large/userexternal/vstajkic/libero
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: Your task is {instruction}. Infer the temporal dynamics from frames
      {actions} and produce the corresponding policy actions {e_actions}.
    resolution_size: 224
    per_device_batch_size: 8
    num_workers: 6
    load_all_data_for_training: true
    action_horizon: 7
    with_state: true
trainer:
  epochs: 100
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 10000                 # weights milestone + full state
  save_every_minutes: 90               # extra full-state saves (rolling, keep_last_states)
  keep_last_states: 3
  auto_resume: true
  resume_from_checkpoint: null
  use_stateful_dataloader: true
  eval_interval: 100
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    vj_predictor: 0.0005
    latent_bottleneck: 0.0005
    anchor_align: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-05
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: /leonardo_scratch/fast/AIFAC_P02_954/models/VLA-JEPA/Pretrain/checkpoints/VLA-JEPA-pretrain.pt
  skip_load_modules: null              # e.g. "vj_predictor" when the target encoder grid changes
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
